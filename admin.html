<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Jadwal Kuliah</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== LAYAR LOGIN ====== -->
  <div id="loginScreen">
    <main class="board">
      <div class="login-card">
        <h2>Masuk Admin</h2>
        <p>Halaman ini hanya untuk pengelola jadwal.</p>
        <form id="loginForm">
          <div class="field">
            <label for="passwordInput">Password</label>
            <input type="password" id="passwordInput" required autofocus>
          </div>
          <p class="error-msg" id="loginError"></p>
          <button type="submit" class="btn btn--primary" style="width:100%;">Masuk</button>
        </form>
      </div>
    </main>
  </div>

  <!-- ====== LAYAR ADMIN ====== -->
  <div id="adminScreen" style="display:none;">
    <main class="board admin-shell">
      <div class="admin-toolbar">
        <div>
      <section class="panel">
        <h2>Daftar Jadwal Tersimpan</h2>
        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Jurusan</th><th>Kelas</th><th>Mata Kuliah</th><th>Dosen</th><th>Ruangan</th><th>Waktu</th><th>Aksi</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2>Impor / Ekspor</h2>
        <div class="io-bar">
          <button id="exportBtn" class="btn btn--primary">Unduh jadwal.json</button>
          <label class="btn btn--ghost" style="cursor:pointer;">
            Impor jadwal.json
            <input type="file" id="importInput" accept="application/json" style="display:none;">
          </label>
          <span class="status-pill" id="statusPill"></span>
        </div>
      </section>
    </main>
  </div>

  <script src="admin.js"></script>
</body>
</html>
